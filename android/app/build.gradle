plugins {
    id 'com.android.application'
}

def sdlDir = file('../../ext/SDL2')
def preprocHost = project.findProperty('SA2_PREPROC_HOST') ?: ''
def requestedAbi = project.findProperty('SA2_ABI') ?: ''

tasks.register('fetchSDL2') {
    outputs.dir(sdlDir)
    doLast {
        if (!file("${sdlDir}/CMakeLists.txt").exists()) {
            sdlDir.parentFile.mkdirs()
            exec {
                commandLine 'git', 'clone', '--depth', '1', '--branch', 'release-2.30.3',
                        'https://github.com/libsdl-org/SDL.git', sdlDir.absolutePath
            }
        }
    }
}

tasks.configureEach {
    if (name.startsWith('configureCMake') || name.startsWith('pre')) {
        dependsOn(tasks.named('fetchSDL2'))
    }
}

android {
    namespace 'com.sat_r.sa2'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.sat_r.sa2'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters requestedAbi ? [requestedAbi] : ['arm64-v8a', 'armeabi-v7a', 'x86_64']
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments '-DANDROID_STL=c++_shared', "-DSA2_PREPROC_HOST=${preprocHost}"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.30.5'
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../../ext/SDL2/android-project/app/src/main/java']
        }
    }
}
