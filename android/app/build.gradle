plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sat_r.sa2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sat_r.sa2'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.30.5'
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../../ext/SDL2/android-project/app/src/main/java']
        }
    }
}
